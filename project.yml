name: HealthJournal
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.check27.healthjournal
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  HealthCore:
    path: .
targets:
  HealthJournal:
    type: application
    platform: iOS
    sources:
      - HealthJournal/App
      - HealthJournal/Services
      - HealthJournal/Views
    resources:
      - HealthJournal/Resources
    dependencies:
      - package: HealthCore
        product: HealthCore
    settings:
      base:
        INFOPLIST_FILE: HealthJournal/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Health Journal
  HealthJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HealthJournalTests]
    dependencies:
      - target: HealthJournal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HealthJournal:
    build:
      targets:
        HealthJournal: all
    test:
      targets: [HealthJournalTests]
